; PlatformIO Project Configuration File
;
;   默认环境（default_envs）指向 ESP32-C6 SuperMini；如仍需 ESP32-C3，可改用：
;       pio run -e makergo_esp32c3_supermini
;
; 本文件同时保留两个环境：
;   [env:esp32c6_supermini]          —— ESP32-C6 SuperMini（4MB Flash）
;   [env:makergo_esp32c3_supermini]  —— Maker Go ESP32-C3 Supermini（原项目目标）

[platformio]
default_envs = esp32c6_supermini

[env:esp32c6_supermini]
platform = espressif32
framework = arduino
board = esp32c6_supermini
board_build.filesystem = littlefs
board_build.variant = super_mini_esp32c6
board_build.variants_dir = custom_variants
board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=1
    -D CONFIG_ESP_COREDUMP_DATA_FORMAT_BIN=1
    -Wl,--allow-multiple-definition
    -Os
extra_scripts =
    pre:script/inject_app_version.py
    pre:script/inject_ota_url.py
    post:script/generate_compilation_database.py
    post:script/upload_littlefs.py
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
    esp32async/ESPAsyncWebServer@^3.10.3
    bblanchon/ArduinoJson@^7.4.0

[env:makergo_esp32c3_supermini]
platform = espressif32
framework = arduino
board = makergo_esp32c3_supermini
board_build.filesystem = littlefs
board_build.variant = super_mini_esp32c3
board_build.variants_dir = custom_variants
board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=1
    -D CONFIG_ESP_COREDUMP_DATA_FORMAT_BIN=1
    -Wl,--allow-multiple-definition
    -Os
extra_scripts =
    pre:script/inject_app_version.py
    pre:script/inject_ota_url.py
    post:script/generate_compilation_database.py
    post:script/upload_littlefs.py
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
    esp32async/ESPAsyncWebServer@^3.10.3
    bblanchon/ArduinoJson@^7.4.0
